
services:
  backend:
    build:
      context: ..
      dockerfile: 2_03-10/Dockerfile.backend
    image: sammy23x/compose-backend:latest
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: 2_03-10/Dockerfile.frontend
    image: sammy23x/compose-frontend:latest
    ports:
      - "5001:5001"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
